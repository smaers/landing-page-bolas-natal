<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crie sua conta | Esferas Encantadas</title><link rel="stylesheet" href="styles.css"><style>body{background:#f5efe2}.page-head{background:linear-gradient(135deg,#0b3322,#071d13);color:#fff;padding:38px 0}.page-head h1{font-size:46px;margin:0 0 8px}.page-head p{opacity:.78}.mini{font-size:12px;color:#6c6257;line-height:1.6}.links{display:flex;justify-content:space-between;gap:10px;margin-top:15px;font-size:12px}.links a{color:#7d0a16;font-weight:700}</style></head><body><div class="page-head"><div class="container"><a href="index.html" class="back">Esferas Encantadas</a><h1>Crie sua conta</h1><p>Salve seus dados para acompanhar pedidos e facilitar novas compras.</p></div></div><main class="section"><div class="profile-card"><div class="form-grid"><div class="field full"><label>Nome completo</label><input id="name" autocomplete="name"></div><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>CPF</label><input id="cpf" inputmode="numeric" maxlength="14"></div><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="new-password"></div><div class="field"><label>Confirmar senha</label><input id="password2" type="password" autocomplete="new-password"></div></div><p class="mini">Para uma operação real, a autenticação deve ser movida para um backend seguro; esta versão mantém a conta apenas no navegador para facilitar o protótipo.</p><div class="form-actions"><button id="submit" class="btn btn-red">CRIAR CONTA</button><span id="msg" class="form-msg"></span></div><div class="links"><a href="index.html">← Voltar</a><a href="login.html">Já tenho conta</a></div></div></main><script src="auth.js"></script></body></html>
